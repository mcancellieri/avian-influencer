<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>See your future, if you dare</title>
    <link rel="stylesheet" href="/src/uncertainfuture/uncertainfuture.css"/>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<main class="scene">
    <h1 class="title">The magic ball of glass</h1>
    <p class="subtitle">Enter your date of birth and gaze into the abyss…</p>
    <form class="controls" id="fortuneForm">
        <input type="text" id="dob" name="dob" required/>

        <div class="stage">
            <div class="scary-sphere" id="sphere">
                <div class="fortune" id="fortune" aria-live="polite"></div>
                <div class="highlight"></div>
                <div class="reflection"></div>
            </div>

        </div>
        <button type="submit">✨ Reveal my fortune</button>
    </form>
    <div class="mist swirl" id="mist"></div>

</main>

<script type="module" src="/src/uncertainfuture/uncertainfuture.js"></script>
</body>
</html>
